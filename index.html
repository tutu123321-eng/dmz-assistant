<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>无人区助手 · MW4 DMZ</title>
<style>
:root{--bg:#0b0f14;--card:#151b23;--line:#25303c;--fg:#e6edf3;--dim:#8b949e;--acc:#f0b429;
 --armory:#58a6ff;--mat:#3fb950;--cash:#f0b429;--intel:#bc8cff;--bunker:#ff7b72;--res:#79c0ff;--ok:#3fb950;--bad:#f85149}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;padding-bottom:78px}
header{position:sticky;top:0;z-index:20;background:rgba(11,15,20,.97);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:8px 12px 6px}
.bar{display:flex;align-items:center;gap:8px}
.back{background:none;border:0;color:var(--acc);font-size:15px;padding:4px 2px;display:none}
h1{font-size:15px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1 small{color:var(--dim);font-weight:400;font-size:11px;margin-left:4px}
input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#0b0f14;color:var(--fg);font-size:15px;outline:none;margin-top:6px}
input:focus{border-color:var(--acc)}
main{padding:10px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.card.link:active{border-color:var(--acc)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.sec{color:#0b0f14;background:var(--acc);border-color:var(--acc);font-weight:800}
.ok{color:var(--ok);border-color:#1f6f34}.warn{color:var(--warn,#d29922);border-color:#5c4a12}.bad{color:var(--bad);border-color:#6e2a26}
.big{font-size:16px;font-weight:650}
.sub{color:var(--dim);font-size:12.5px}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:var(--dim);word-break:break-all}
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0 2px}
.chip{flex:0 0 auto;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#11161d;color:var(--dim);font-size:13px}
.chip.on{background:var(--acc);color:#0b0f14;border-color:var(--acc);font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#0b0f14;border-top:1px solid var(--line);padding:5px 0 calc(5px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--dim);font-size:10.5px;padding:5px 0}
nav button b{display:block;font-size:19px;line-height:1.15;font-weight:400}
nav button.on{color:var(--acc)}
.empty{color:var(--dim);text-align:center;padding:30px 10px}
.stop{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.stop:last-child{border:0}
.num{flex:0 0 26px;height:26px;border-radius:50%;background:var(--acc);color:#0b0f14;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.k{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.sectl{display:flex;gap:6px;align-items:center;margin-top:6px}
.tabbar{position:sticky;top:0}
.mapwrap{position:relative;margin:8px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:
 radial-gradient(120% 80% at 15% 20%,#1b2630 0%,#0f151b 60%),#0f151b}

.mz{position:absolute;inset:0;transform-origin:0 0;will-change:transform;touch-action:none}
.mapctl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px;z-index:5}
.mapctl button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:rgba(11,15,20,.85);
 color:var(--fg);font-size:16px;line-height:1;backdrop-filter:blur(6px)}
.mapwrap{touch-action:none}
.basemap{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;display:block}
.poi{position:absolute;width:16px;height:16px;transform:translate(-50%,-50%) scale(var(--inv,1));border-radius:50%;cursor:pointer;
 background:rgba(240,180,41,.35);box-shadow:0 0 0 2px rgba(240,180,41,.95),0 0 10px rgba(240,180,41,.5)}
.poi b{position:absolute;left:12px;top:-8px;transform:scale(var(--inv,1));transform-origin:left center;font-size:10px;color:#ffd76a;white-space:nowrap;font-weight:700;text-shadow:0 1px 3px #000}
.poi.active{background:rgba(240,180,41,.7);box-shadow:0 0 0 3px #f0b429,0 0 16px #f0b429}
.dot{position:absolute;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%) scale(var(--inv,1));border:1px solid #0b0f14;cursor:pointer}
.dsector{position:absolute;transform:translate(6px,-13px) scale(var(--inv,1));font-size:7px;color:#fff;text-shadow:0 1px 2px #000;pointer-events:none}
.legend{display:flex;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:11px;margin-top:6px}
</style>

function norm(x){return (x||'').toLowerCase().replace(/[\s·\-_,，。()（）]/g,'');}
function score(t, kw){
  if(!kw) return 0;
  const k=norm(kw);
  if(k && (norm(t.zh).includes(k)||norm(t.n).includes(k))) {
    if(norm(t.zh).startsWith(k)) return 100;
    return 85;
  }
  const s=(t.zh||'')+' '+(t.n||'')+' '+(t.py||'')+' '+(t.in||'')+' '+(t.en||'')+' '+((t.desc||''))
    +' '+(t.s||'')+' '+(t.poi_zh||'')+' '+(t.cls_zh||'')+' '+(t.fl||'');
  const low=s.toLowerCase();
  if((t.zh||'').toLowerCase().startsWith(kw)) return 100;
  if((t.zh||'').toLowerCase().includes(kw)) return 85;
  if((t.py||'').startsWith(kw)) return 70;
  if((t.in||'').startsWith(kw)) return 60;
  if((t.in||'').includes(kw)) return 55;
  if((t.py||'').includes(kw)) return 50;
  if(low.includes(kw)) return 45;
  return 0;
}
function filterList(list, kw){
  if(!kw) return list.slice();
  return list.map(x=>({x,s:score(x,kw)})).filter(o=>o.s>0).sort((a,b)=>b.s-a.s).map(o=>o.x);
}

function itemPage(r){
  const stops={}, missing=[];
  r.ing.forEach(ing=>{
    const m=MATS[ing.id]; if(!m) { missing.push(ing.zh); return; }
    const ps=m.places.filter(p=>p.s);
    if(!ps.length){missing.push(ing.zh); return;}
    ps.forEach(p=>{
      if(!stops[p.id]) stops[p.id]={...p,mats:new Set(),conf:0};
      stops[p.id].mats.add(m.zh); stops[p.id].conf=Math.max(stops[p.id].conf,p.c);
    });
  });
  let list=Object.values(stops), order=[], cur=null;
  const cn=s=>s?parseInt(s.charCodeAt(0)-64):99, rn=s=>s?parseInt(s.slice(1)):99;
  const dist=(a,b)=>Math.abs(cn(a)-cn(b))+Math.abs(rn(a)-rn(b));
  if(list.length) cur=list.reduce((x,y)=>y.mats.size>x.mats.size?y:x).s;
  while(list.length&&order.length<6){
    list.sort((a,b)=>b.mats.size-a.mats.size||b.conf-a.conf||dist(cur,a.s)-dist(cur,b.s));
    const x=list.shift(); order.push(x); cur=x.s||cur;
  }
  let h=`<div class="card"><div class="row"><span class="big grow">${esc(r.zh)}</span><span class="tag">${esc(r.rar)}</span></div>
    <div class="mono">${esc(r.n)}</div>
    <div class="sub" style="margin-top:6px">材料：${r.ing.map(i=>`<a style="color:var(--acc)" onclick="go('mat','${i.id}')">${esc(i.zh)}</a>×${i.q}`).join('、')}</div></div>`;
  if(order.length){
    h+=`<div class="card"><div class="sub">路线（${order.length} 站）</div>`;
    order.forEach((s,i)=>{
      h+=`<div class="stop"><div class="num">${i+1}</div><div class="grow">
        <div class="row"><span class="big">${esc(s.zh||s.n)}</span>${s.s?`<span class="tag sec">${s.s}</span>`:''}${s.t?`<span class="tag warn">${s.t}</span>`:''}</div>
        <div class="sub">拿：${[...s.mats].map(esc).join('、')}</div>
        <div class="sub" style="margin-top:4px"><a style="color:var(--acc)" onclick="go('place','${s.id}')">看该地点 →</a></div>
        </div></div>`;
    });
    h+=`</div>`;
  }
  if(missing.length) h+=`<div class="card"><span class="tag bad">缺数据</span> <span class="sub">${missing.map(esc).join('、')}</span></div>`;
  return h;
}

let MAPS={};
function mapHtml(active, focus, hpx, zoom){
  const Z=zoom||1;
  const id='m'+Math.random().toString(36).slice(2,8);
  MAPS[id]={focus:focus||null, z:Z};
  let s=`<div class="mapwrap" id="${id}" data-focus="${focus||''}" data-z="${Z}" style="aspect-ratio:1140/1080">`;
  s+=`<div class="mz">`;
  s+=mapInner(active, focus, Z);
  s+=`</div>`;
  s+=`<div class="mapctl"><button data-mz="in">＋</button><button data-mz="out">－</button><button data-mz="reset">⟲</button></div>`;
  s+=`</div>`;

    .map(([c,t])=>`<span><i class="k" style="background:${CLS_COLOR[c]}"></i>${t}</span>`).join('')+`</div>`;
  return s;
}
function mapInner(active, focus, Z){
  let s=`<img class="basemap" src="${D.mapimg}" alt="Hajin">`;
  Object.entries(D.places).forEach(([id,p])=>{
    if(!p.pos) return;
    const [x,y]=p.pos;
    s+=`<div class="poi ${active===id?'active':''}" data-id="${id}" style="left:${x}%;top:${y}%"
      onclick="go('place','${id}')"><b>${esc(POI_SHORT[id]||p.zh)}</b></div>`;
    p.keys.forEach((kid,i)=>{
      const k=KEYS[kid], n=p.keys.length;
      const ang=(i/Math.max(n,1))*2*Math.PI, rad=(Z>2?1.0:1.6);
      const cx=x+Math.cos(ang)*rad, cy=y+Math.sin(ang)*rad*1.1;
      s+=`<div class="dot" style="left:${cx}%;top:${cy}%;background:${CLS_COLOR[k.cls]||'#999'}"
        onclick="event.stopPropagation();go('key','${kid}')"></div>`;
      if(Z>2) s+=`<span class="dsector" style="left:${cx}%;top:${cy}%">${k.s||''}</span>`;
    });
  });
  return s;
}

  const W=()=>w.clientWidth, H=()=>w.clientHeight;
  function apply(){ mz.style.transform=`translate(${tx}px,${ty}px) scale(${s})`; mz.style.setProperty('--inv', 1/s); }
  function clamp(){
    const minX=W()-W()*s, minY=H()-H()*s;
    tx=Math.min(0,Math.max(minX,tx)); ty=Math.min(0,Math.max(minY,ty));
  }
  function zoomAt(cx,cy,ns){
    ns=Math.max(1,Math.min(5,ns));
    const k=ns/s;
    tx=cx-(cx-tx)*k; ty=cy-(cy-ty)*k; s=ns; clamp(); apply();
  }
  // 初始：地点页聚焦该据点
  const f=w.dataset.focus, z=parseFloat(w.dataset.z||'1');
  if(f&&D.places[f]&&D.places[f].pos&&z>1){
    s=z;
    const [px,py]=D.places[f].pos;
    tx=W()/2-(px/100)*W()*s; ty=H()/2-(py/100)*H()*s;
    clamp(); apply();
  }
  w.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,s*(e.deltaY<0?1.15:0.87));},{passive:false});
  let pts=new Map(), start=null, moved=false;
  w.addEventListener('pointerdown',e=>{
    if(e.target.closest('.mapctl')) return;
    w.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    moved=false;
    if(pts.size===1) start={x:e.clientX,y:e.clientY,tx,ty,s};
    else if(pts.size===2){
      const [a,b]=[...pts.values()];
      start={d:Math.hypot(a.x-b.x,a.y-b.y),s,tx,ty,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};
    }
  });
  w.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId)) return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===1&&start&&start.d===undefined){
      const dx=e.clientX-start.x, dy=e.clientY-start.y;
      if(Math.abs(dx)+Math.abs(dy)>6) moved=true;
      if(s>1){ tx=start.tx+dx; ty=start.ty+dy; clamp(); apply(); }
    } else if(pts.size===2&&start&&start.d!==undefined){
      const [a,b]=[...pts.values()];
      const d=Math.hypot(a.x-b.x,a.y-b.y);
      const ns=Math.max(1,Math.min(5,start.s*(d/start.d)));
      const r=w.getBoundingClientRect();
      const cx=(a.x+b.x)/2-r.left, cy=(a.y+b.y)/2-r.top;
      s=ns;
      tx=cx-((start.cx-r.left)-start.tx)*(ns/start.s);
      ty=cy-((start.cy-r.top)-start.ty)*(ns/start.s);
      clamp(); apply();
    }
  });
  function up(e){
    pts.delete(e.pointerId);
    if(pts.size<2) start=pts.size===1?{x:[...pts.values()][0].x,y:[...pts.values()][0].y,tx,ty,s}:null;
  }
  w.addEventListener('pointerup',up); w.addEventListener('pointercancel',up);
  w.addEventListener('dblclick',e=>{
    const r=w.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top, s>1.2?1:2.6);
  });
  w.querySelectorAll('.mapctl button').forEach(b=>b.addEventListener('click',ev=>{
    ev.stopPropagation();
    const act=b.dataset.mz;
    if(act==='in') zoomAt(W()/2,H()/2,s*1.4);
    else if(act==='out') zoomAt(W()/2,H()/2,s/1.4);
    else { s=1;tx=0;ty=0;apply(); }
  }));
}
/* 标签避让：挨着就往上错开 */
function layoutLabels(){
  document.querySelectorAll('.mapwrap').forEach(w=>{
    const placed=[];
    w.querySelectorAll('.poi b').forEach(b=>{
      b.style.transform='';
      let r=b.getBoundingClientRect(), tries=0;
      const hit=rr=>placed.some(p=>!(rr.right<p.left-3||rr.left>p.right+3||rr.bottom<p.top-3||rr.top>p.bottom+3));
      while(hit(r)&&tries<8){ tries++; b.style.transform=`translateY(${-13*tries}px)`; r=b.getBoundingClientRect(); }
      placed.push(r);
    });
  });
}
function mapPage(){
  let h=`<div class="sub">官方 HAJIN 战术地图（你提供的图）· 13 个据点已标点 · 圆点=钥匙房，点开看楼层/格号</div>`;
  h+=mapHtml(null,null,340);
  h+=`<div class="card"><div class="sub">双指缩放 / 拖动看细节；点据点或圆点进入详情</div></div>`;
  view.innerHTML=h;
}

/* ---------- 路由 ---------- */
function render(){
  setTimeout(mountMaps,0);
  const kw=q.value.trim().toLowerCase();
  if(state.hash){
    const [_,type,id]=state.hash.split('/');
    backBtn.style.display='inline-block';
    if(type==='item'&&RECS[id]){ titleEl.textContent=RECS[id].zh; view.innerHTML=itemPage(RECS[id]); }
    else if(type==='mat'&&MATS[id]){ titleEl.textContent=MATS[id].zh; view.innerHTML=matPage(MATS[id]); }
    else if(type==='key'&&KEYS[id]){ titleEl.textContent=KEYS[id].zh; view.innerHTML=keyPage(KEYS[id]); }
    else if(type==='place'&&D.places[id]){ titleEl.textContent=D.places[id].zh; view.innerHTML=placePage(D.places[id]); }
    else location.hash='';
    return;
  }
  backBtn.style.display='none';
  const t={item:'物品',mat:'材料',key:'钥匙',place:'地点',map:'地图'}[state.tab];
  titleEl.innerHTML=`无人区助手 <small>${t}</small>`;
  ({item:listItems,mat:listMats,key:listKeys,place:listPlaces,map:mapPage}[state.tab])();
}
function go(type,id){ state.hash=`#/${type}/${id}`; location.hash=state.hash; render(); window.scrollTo(0,0); }
backBtn.onclick=()=>{ history.back(); };
window.onhashchange=()=>{ state.hash=location.hash; render(); };
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  state.tab=b.dataset.tab; state.hash=''; location.hash='';
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  q.value=''; q.placeholder={item:'搜：背包 / bb / 3板甲',mat:'搜：复合材料 / fhcl',key:'搜：钥匙 / B5',place:'搜：空军基地 / 赌场',map:''}[state.tab]||'搜';
  render(); window.scrollTo(0,0);
});
q.oninput=()=>render();
state.hash=location.hash||'';
render();
